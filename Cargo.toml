[workspace]
members = [
    "crates/memory-engine",
    "crates/server",
    "crates/storage",
    "crates/supermemory",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
axum = "0.8"
aes-gcm = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
http = "1"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
postgres-types = "0.2"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rpassword = "7"
rig-core = { version = "0.40", default-features = false, features = ["rustls"] }
schemars = "1"
getrandom = "0.3"
pbkdf2 = "0.12"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
turso_pg = { path = "../turso/postgres/frontend" }
turso_pg_server = { path = "../turso/postgres/server" }
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 8
strip = "symbols"
